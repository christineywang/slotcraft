services:
  postgres:
    image: postgres:16-alpine
    container_name: slotcraft-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: slotcraft
      POSTGRES_PASSWORD: slotcraft
      POSTGRES_DB: slotcraft
    volumes:
      - slotcraft_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotcraft -d slotcraft"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  slotcraft_pg:
